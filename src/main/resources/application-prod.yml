spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/solicitation}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: false
  flyway:
    enabled: true
