spring:
  application:
    name: ServiceRequest
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  elasticsearch:
    uris: ${ELASTIC_SEARCH_URI}

server:
  servlet:
    context-path: /api

security:
  jwt:
    access-token-expiration: ${JWT_TOKEN_EXPIRATION:3600}
    issuer: ${JWT_ISSUER:localhost}

    public-key: classpath:keys/public.pem
    private-key: classpath:keys/private.pem

app:
  initial-admin:
    name: ${APP_ADMIN_NAME}
    email: ${APP_ADMIN_EMAIL}
    password: ${APP_ADMIN_PASSWORD}
