spring:
  application:
    name: ServiceRequest
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  servlet:
    context-path: /api

security:
  jwt:
    access-token-expiration: ${JWT_TOKEN_EXPIRATION:3600}
    issuer: ${JWT_ISSUER:localhost}

    public-key: classpath:keys/public.pem
    private-key: classpath:keys/private.pem
